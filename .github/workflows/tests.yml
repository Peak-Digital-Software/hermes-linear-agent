name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hermes-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git ../hermes-agent
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ../hermes-agent
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Verify pip entry-point loading
        run: |
          export HERMES_HOME="$(mktemp -d)"
          python -c "from pathlib import Path; import os; Path(os.environ['HERMES_HOME'], 'config.yaml').write_text('plugins:\n  enabled:\n    - linear-agent\n')"
          python scripts/verify_plugin_load.py

  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build ruff
      - run: ruff check hermes_linear_agent tests scripts __init__.py
      - run: ruff format --check hermes_linear_agent tests scripts __init__.py
      - run: python -m compileall -q hermes_linear_agent tests scripts __init__.py
      - run: python -m build

  # The org ruleset "ci green before merge" requires a check named `ci`.
  ci:
    needs: [hermes-compatibility, package-quality]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
