name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hermes-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git ../hermes-agent
      - run: python -m pip install --upgrade pip uv
      # hermes-agent's dependency overrides live in [tool.uv]; plain pip cannot resolve it.
      - run: uv pip install --python "$(which python)" -e .
        working-directory: ../hermes-agent
      - run: uv pip install --python "$(which python)" -e ".[dev]"
      - run: python -m pytest
      - name: Verify directory plugin loading
        run: |
          export HERMES_HOME="$(mktemp -d)"
          mkdir -p "$HERMES_HOME/plugins"
          ln -s "$PWD" "$HERMES_HOME/plugins/linear-agent"
          printf 'plugins:\n  enabled:\n    - linear-agent\n' > "$HERMES_HOME/config.yaml"
          python scripts/verify_plugin_load.py

  package-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build ruff
      - run: ruff check hermes_linear_agent tests scripts __init__.py
      - run: ruff format --check hermes_linear_agent tests scripts __init__.py
      - run: python -m compileall -q hermes_linear_agent tests scripts __init__.py
      - run: python -m build

  # The org ruleset "ci green before merge" requires a check named `ci`.
  ci:
    needs: [hermes-compatibility, package-quality]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
