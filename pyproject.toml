[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-linear-agent"
version = "0.4.2"
description = "Linear Agent Session platform and attributed Linear tools for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ritchie" }]
dependencies = [
  "aiohttp>=3.12",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/infinityrobot/hermes-linear-agent"
Repository = "https://github.com/infinityrobot/hermes-linear-agent"
Issues = "https://github.com/infinityrobot/hermes-linear-agent/issues"

[project.entry-points."hermes_agent.plugins"]
linear-agent = "hermes_linear_agent"

[project.scripts]
hermes-linear-agent-oauth = "hermes_linear_agent.oauth:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["hermes_linear_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
